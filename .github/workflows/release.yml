name: Binary Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm test

  build-binaries:
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: macos-x64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-latest
          - target: win-x64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.target }}
        run: |
          pnpm run clean
          pnpm run bundle
          node scripts/build-release.mjs ${{ matrix.target }}

      - name: Upload ${{ matrix.target }} binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/md-to-docx-*

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSET_DIR="release-assets"
          PROJECT_DIR="md-to-docx-local-${TAG}"

          mkdir -p "$ASSET_DIR"

          git archive \
            --format=tar.gz \
            --prefix="${PROJECT_DIR}/" \
            -o "${ASSET_DIR}/${PROJECT_DIR}-source.tar.gz" \
            HEAD

          git archive \
            --format=zip \
            --prefix="${PROJECT_DIR}/" \
            -o "${ASSET_DIR}/${PROJECT_DIR}-source.zip" \
            HEAD

          (cd "$ASSET_DIR" && sha256sum * > SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: md-to-docx-local-${{ github.ref_name }}
          path: release-assets/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
